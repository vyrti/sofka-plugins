name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changes.outputs.plugins }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changes="$(python3 scripts/catalog.py changes --base "$BASE" --head "$HEAD" --mode test)"
          echo "plugins=$(jq -c .plugins <<<"$changes")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .matrix <<<"$changes")" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - name: Validate catalog and sources
        run: python3 scripts/catalog.py validate
      - name: Reject replacement of a published version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/catalog.py assert-unpublished --base "$BASE" --head "$HEAD"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint adapters
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test adapters
        run: cargo test --locked --workspace

  build:
    needs: [changes, validate]
    if: needs.changes.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build adapter
        run: cargo build --release --locked --package "sofka-plugin-${{ matrix.plugin }}" --target "${{ matrix.target }}"
      - name: Test adapter fixture
        env:
          PLUGIN: ${{ matrix.plugin }}
          TARGET: ${{ matrix.target }}
        run: |
          "target/$TARGET/release/sofka-plugin-$PLUGIN" < "plugins/$PLUGIN/fixtures/request.json" > report.json
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == json.load(open(sys.argv[2]))' report.json "plugins/$PLUGIN/fixtures/report.json"
      - name: Build deterministic package
        env:
          PLUGIN: ${{ matrix.plugin }}
          TARGET: ${{ matrix.target }}
        run: |
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "plugins/$PLUGIN/publication.json")"
          python3 scripts/catalog.py package \
            --plugin "$PLUGIN" \
            --target "$TARGET" \
            --binary "target/$TARGET/release/sofka-plugin-$PLUGIN" \
            --output "$PLUGIN-$version-$TARGET.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.plugin }}-${{ matrix.target }}
          path: ${{ matrix.plugin }}-*.tar.gz
