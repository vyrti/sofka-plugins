schema_version = 2

[package]
display_name = "Deprecated APIs"
version = "0.1.0"
authors = ["vyrti"]
license = "MIT OR Apache-2.0"
description = "Find deprecated and removed Kubernetes apiVersions with Pluto or kubent, for the whole context or one selected resource."
repository = "https://github.com/nklmilojevic/sofka-plugins"
readme = "README.md"
sofka = ">=0.27.4"
platforms = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
tags = ["deprecations", "upgrade", "apiversions", "pluto", "kubent", "report"]

# The two tools answer the same question. Install either one; each command
# names the tool it needs, so one tool is enough to make the package useful.
[[package.requirements]]
name = "pluto"
install = "Install Pluto from https://pluto.docs.fairwinds.com/installation/"

[[package.requirements]]
name = "kubent"
install = "Install kubent from https://github.com/doitintl/kube-no-trouble#installation"

[[commands]]
name = "Deprecated APIs with Pluto"
palette = "pluto-cluster"
command = "./adapter"
args = ["pluto"]
requires = ["pluto"]
install = "Install Pluto from https://pluto.docs.fairwinds.com/installation/"
# The deprecations belong to the context, not to a selected resource.
target = "context"
output = "report"
mutating = false
# Pluto lists every API resource and every Helm release in the cluster.
timeout = "3m"

[commands.inputs.namespace]
type = "string"
default = ""

[commands.inputs.target_version]
type = "string"
default = ""

[commands.inputs.report]
type = "string"
default = ""

[[commands]]
name = "Deprecated APIs with kubent"
palette = "kubent-cluster"
command = "./adapter"
args = ["kubent"]
requires = ["kubent"]
install = "Install kubent from https://github.com/doitintl/kube-no-trouble#installation"
target = "context"
output = "report"
mutating = false
timeout = "3m"

[commands.inputs.target_version]
type = "string"
default = ""

[commands.inputs.report]
type = "string"
default = ""

[[commands]]
name = "Check selection for deprecations"
palette = "pluto-resource"
command = "./adapter"
args = ["resource"]
requires = ["pluto"]
install = "Install Pluto from https://pluto.docs.fairwinds.com/installation/"
# Any kind: the check is on the apiVersion, which every object carries.
target = "selection"
output = "report"
# Pipes the selected object into `pluto detect -`. Nothing is sent to the
# cluster and nothing is written.
mutating = false
timeout = "30s"

[commands.inputs.report]
type = "string"
default = ""
